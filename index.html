<meta charset=utf-8>
<meta name=viewport content=width=device-width,initial-scale=1>
<link rel=icon href=www/baremark.svg>
<link rel=stylesheet href=www/main.css>
<input id=invertmode type=checkbox>
<main></main>
<footer>© 2022–2025 by zrajm, Uppsala.</footer>
<script type=module>
  import('./addon/table.js')
    .then(() => import('./addon/toc.js'))
    .then(() => {
      const query   = location.search.slice(1)
      const file    = query || 'README.md'
      const [addon] = query.split('/').slice(-1)
      document.title = `${addon || file} (Baremark${addon && ' Addon'} Docs)`
      fetch(file)
        .then(x => x.text())
        .then(md => {
          document.querySelector('main')
            .innerHTML = `<div class=docs>${baremark(md)}</div>`
          // If page finished redrawing, and is at top of page (= user hasn't
          // scrolled down), jump #hash fragment in URL (if there is one).
          setTimeout(() => {
            if (location.hash && scrollY === 0) {
              location.href = location.hash
            }
          }, 0)
        })
    })
</script>
