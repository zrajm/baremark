<link rel=stylesheet href=index.css>
<input id=invertmode type=checkbox>
<main></main>
<footer>© 2022–2025 by zrajm, Uppsala.</footer>
<script type=module>
  import('./addon/table.js')
    .then(() => import('./addon/toc.js'))
    .then(() => {
      const query   = location.search.slice(1)
      const file    = query || 'README.md'
      const [addon] = query.split('/').slice(-1)
      console.log(addon)
      document.title = `${addon || file} (Baremark${addon && ' Addon'} Docs)`
      fetch(file).then(x => x.text()).then(
        md => document.querySelector('main')
          .innerHTML = `<div class=docs>${baremark(md)}</div>`)
    })
</script>
