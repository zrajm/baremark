<meta charset=utf-8>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel=icon href=baremark.svg>
<title>README (Baremark: A Tiny Markdown Engine)</title>
<link rel=stylesheet href=index.css>
<input id=invertmode type=checkbox>
<script type=module>
  import('./addon/toc.js')
  .then(() => import('./addon/table.js'))
  .then(() => {
    fetch('README.md')
      .then(x => x.text())
      .then(md => document.body.insertAdjacentHTML(
        'beforeend', `<div class=docs>${baremark(md)}</div>`))
  })
</script>
