**← Type something to the left** to try it out.

[Baremark] is a *super*-minimal Markdown parser. **Less** than 2K of *unminified* Javascript! It’s not fully CommonMark compliant, but support all the stuff one would expect, like *italics*, **bold,** ___underline___, `monospace` and ~~strikethrough~~.

* * *

Pros:

1. Veeery small!
2. Extendable (using [addons]).

Cons:

+ No nested lists.
+ No indented code blocks.

* * *

[Different] [types][a] of [links](http://zrajm.org) and images are all supported.
